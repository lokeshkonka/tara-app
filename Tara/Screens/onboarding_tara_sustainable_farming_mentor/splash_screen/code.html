<style type="text/tailwindcss">
        @layer utilities {
            .animate-fade-in-up {
                animation: fadeInUp 1s ease-out forwards;
            }
            .animate-pulse-slow {
                animation: pulseSlow 3s infinite;
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulseSlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
    </style>
