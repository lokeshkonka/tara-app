<div class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-fixed opacity-10 blur-[80px] pointer-events-none"></div>
<main class="w-full max-w-md mx-auto px-margin-mobile py-section-padding flex flex-col items-center justify-between min-h-[100dvh] relative z-10">

<div class="flex-1"></div>

<div class="flex flex-col items-center text-center space-y-stack-lg w-full">

<div class="relative w-48 h-64 md:w-64 md:h-64 mb-stack-md flex items-center justify-center">

<div class="absolute inset-0 bg-surface-container-high rounded-full transform -rotate-6 scale-95 opacity-50 blur-sm"></div>

</div>

<div class="space-y-stack-sm flex flex-col items-center w-full px-gutter">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">
                    Learn Every Day
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                    Get bite-sized, easy-to-follow lessons on natural farming techniques tailored for your land.
                </p>
</div>
</div>
<!-- Bottom Navigation & Progression Cluster -->
<div class="flex-1 w-full flex flex-col justify-end items-center space-y-stack-lg mt-section-padding pb-stack-lg min-h-[240px]">
<!-- Progress Dots (3/8) -->
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
<div class="w-6 h-2 rounded-full bg-primary-container transition-all shadow-[0_2px_8px_rgba(76,175,80,0.2)]"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant transition-colors"></div>
</div>
